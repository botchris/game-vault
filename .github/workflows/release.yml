# Publishes the Docker image when a version tag is pushed (git push origin vX.Y.Z, after
# `task release -- X.Y.Z`): the same checks as CI first, then `task docker:publish`, the same task
# used by hand, for linux/amd64 and linux/arm64 with the tags build/release.sh chooses (1.2.3, 1.2,
# 1 and latest; a pre-release only gets its own tag).
#
# Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token
# with Read & Write access to the repository).
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

# Two tags pushed together publish one after the other, never at the same time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the Docker image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: docker-hub
    steps:
      # The whole history: the version comes from `git describe` on the tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/toolchain

      # Docker Hub sometimes stops answering for a moment (the 0.3.0 release failed on a login
      # timeout): the login and the push are retried with a growing pause before giving up.
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin; then
              exit 0
            fi
            echo "::warning::Docker Hub login failed (attempt $attempt of 5); retrying"
            sleep $((attempt * 15))
          done
          exit 1

      # --yes answers the confirmation prompt the task shows when run by hand. The task checks that
      # the commit carries the tag and that the tree is clean. Pushing the same tags again is safe.
      - name: task docker:publish
        run: |
          for attempt in 1 2 3; do
            if task docker:publish --yes; then
              exit 0
            fi
            echo "::warning::Publishing failed (attempt $attempt of 3); retrying"
            sleep $((attempt * 30))
          done
          exit 1

      - name: Summary
        run: |
          {
            echo "### Game Vault ${GITHUB_REF_NAME} published"
            echo
            echo "Image tags: $(build/release.sh docker-tags botchrishub/game-vault | sed 's/-t //g')"
          } >> "$GITHUB_STEP_SUMMARY"
