# Installs Task and loads the toolchain image (build/toolchain.Dockerfile) under the tag Taskfile.yml
# expects, so `task toolchain` finds it and builds nothing. The image layers are cached in GitHub
# Actions' cache: a run only rebuilds them when the Dockerfile changes.
name: Toolchain
description: Install Task and load the Game Vault toolchain image

runs:
  using: composite
  steps:
    - uses: arduino/setup-task@v2
      with:
        version: 3.x
        repo-token: ${{ github.token }}

    # The same tag as TOOLCHAIN in Taskfile.yml: a hash of the Dockerfile.
    - name: Toolchain tag
      id: tag
      shell: bash
      run: echo "hash=$(sha256sum build/toolchain.Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v3

    - name: Build the toolchain image
      uses: docker/build-push-action@v6
      with:
        context: build
        file: build/toolchain.Dockerfile
        tags: gamevault-toolchain:${{ steps.tag.outputs.hash }}
        load: true
        cache-from: type=gha,scope=toolchain
        cache-to: type=gha,scope=toolchain,mode=max
