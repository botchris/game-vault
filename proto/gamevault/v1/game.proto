syntax = "proto3";

package gamevault.v1;

import "google/protobuf/timestamp.proto";

option go_package = "gamevault/internal/gen/gamevault/v1;gamevaultv1";

// CopyKind describes how a copy of a game is owned.
enum CopyKind {
  COPY_KIND_UNSPECIFIED = 0;
  // A redeemable CD key (Humble Bundle, Fanatical, gifts...).
  COPY_KIND_KEY = 1;
  // The game is already in an account library (Steam, Ubisoft Connect, EA app...).
  COPY_KIND_LIBRARY = 2;
  // A disc or cartridge.
  COPY_KIND_PHYSICAL = 3;
}

// CopyStatus is the lifecycle state of a copy. Valid values depend on the kind:
//   key:      UNREVEALED, REVEALED, REDEEMED, GIFTED, EXPIRED
//   library:  OWNED
//   physical: OWNED, LENT, SOLD
enum CopyStatus {
  COPY_STATUS_UNSPECIFIED = 0;
  COPY_STATUS_UNREVEALED = 1;
  COPY_STATUS_REVEALED = 2;
  COPY_STATUS_REDEEMED = 3;
  COPY_STATUS_GIFTED = 4;
  COPY_STATUS_EXPIRED = 5;
  COPY_STATUS_OWNED = 6;
  COPY_STATUS_LENT = 7;
  COPY_STATUS_SOLD = 8;
}

// PlayStatus says where the user is with a game. It belongs to the game, not to a copy.
enum PlayStatus {
  // The user has not said.
  PLAY_STATUS_UNSPECIFIED = 0;
  // Owned and meant to be played.
  PLAY_STATUS_BACKLOG = 1;
  // Being played now.
  PLAY_STATUS_PLAYING = 2;
  // Played to the end, or as far as the user wanted.
  PLAY_STATUS_FINISHED = 3;
  // Started and dropped.
  PLAY_STATUS_ABANDONED = 4;
}

// CopyGrade is how good a physical copy looks, as collectors grade it.
enum CopyGrade {
  COPY_GRADE_UNSPECIFIED = 0;
  COPY_GRADE_SEALED = 1;
  COPY_GRADE_MINT = 2;
  COPY_GRADE_VERY_GOOD = 3;
  COPY_GRADE_GOOD = 4;
  COPY_GRADE_ACCEPTABLE = 5;
  COPY_GRADE_DAMAGED = 6;
}

// CopyContent is one part of what a physical copy comes with.
enum CopyContent {
  COPY_CONTENT_UNSPECIFIED = 0;
  COPY_CONTENT_BOX = 1;
  COPY_CONTENT_MANUAL = 2;
  // The disc or cartridge.
  COPY_CONTENT_MEDIA = 3;
  // Map, poster, figure, art book…
  COPY_CONTENT_EXTRAS = 4;
}

// Money is an amount of an ISO 4217 currency in that currency's minor unit (cents for EUR, yen for
// JPY); absent or a zero amount when there is no price.
message Money {
  int64 amount_minor = 1;
  string currency = 2;
}

// CopyDetails holds the editable attributes of a copy.
message CopyDetails {
  reserved 9;
  reserved "condition";

  CopyKind kind = 1;
  // Store, launcher or console: "Steam", "Ubisoft Connect", "PS4"...
  string platform = 2;
  CopyStatus status = 3;
  // CD key or gift link. Keys only.
  string key = 4;
  // Redeem deadline as YYYY-MM-DD. Keys only; empty when there is none.
  string redeem_by = 5;
  // Where it came from: bundle name, shop, gift...
  string origin = 6;
  // Purchase date as YYYY-MM-DD.
  string acquired_on = 7;
  string edition = 8;
  // Physical only: where it is stored.
  string location = 10;
  string notes = 11;
  // Physical only: EAN-13 / UPC-A printed on the box (UPC-A is returned as EAN-13).
  string barcode = 12;
  // Physical only: how good it looks. Unspecified: not stated.
  CopyGrade grade = 13;
  // Physical only: what it comes with, without duplicates. Empty: not stated.
  repeated CopyContent contents = 14;
  // What was paid; absent or zero amount: no price.
  Money price = 15;
}

// Photo is a picture of a copy the user uploaded (POST /media/photos). The image is served at
// GET /media/photos/{id} and its thumbnail at GET /media/photos/{id}/thumb.
message Photo {
  // SHA-256 of the stored JPEG, lowercase hex.
  string id = 1;
  string caption = 2;
  // From the photo's metadata: the camera's clock reading, as UTC. Absent when unknown.
  google.protobuf.Timestamp taken_at = 3;
  google.protobuf.Timestamp added_at = 4;
}

// Estimate is a source's latest second-hand price for a physical copy. All its amounts are in one
// currency.
message Estimate {
  // The price provider ("cex-prices", "ebay-prices").
  string provider = 1;
  // What the shop sells it for, or the median asking price of the listings.
  Money sell = 2;
  // What a shop pays for it in cash or store credit; absent when the source does not buy.
  Money buy_cash = 3;
  Money buy_credit = 4;
  // How many listings the price was taken from; 0 for a shop's price.
  int32 listings = 5;
  // The product's page at the source.
  string url = 6;
  google.protobuf.Timestamp fetched_at = 7;
}

// Copy is one owned instance of a game.
message Copy {
  string id = 1;
  CopyDetails details = 2;
  // Source that manages this copy; empty when it was added by hand.
  string source_id = 3;
  // Stable identifier inside the source, used to update instead of duplicate on re-sync.
  string external_id = 4;
  // True for a pending key (unrevealed or revealed) of a game you already own
  // in a library on the same platform. A good candidate to gift.
  bool redundant = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // The user's photos of the copy, in their order.
  repeated Photo photos = 8;
  // Latest second-hand price per source (physical copies with a barcode).
  repeated Estimate estimates = 9;
  // When the prices are next estimated; absent when none is planned.
  google.protobuf.Timestamp next_valuation = 10;
  // When the prices were last asked, whatever the sources answered; absent when never.
  google.protobuf.Timestamp valued_at = 11;
}

// Game is the aggregate root: a title plus every copy you own of it.
message Game {
  reserved 3;
  reserved "steam_app_id";

  string id = 1;
  string title = 2;
  string notes = 4;
  repeated Copy copies = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // Custom cover image URL. When empty the cover providers choose one.
  // The image itself is served over plain HTTP at GET /media/covers/{id}.
  string cover_url = 8;
  // From the cached game details (see MetadataService), in ListGamesRequest.language.
  // Empty until the game's details have been downloaded.
  repeated string genres = 9;
  // 0 when unknown.
  int32 release_year = 10;
  // Stores the game is linked to: link key ("steam") → the game's id there ("620"). Providers
  // that know a store use its link for covers and details; imports use links to match games.
  map<string, string> links = 11;
  // One of the copies' photos used as the cover (it wins over cover_url); empty when none.
  string cover_photo_id = 12;
  PlayStatus play_status = 13;
  // The user's score from 1 to 5 stars; 0 when unrated.
  int32 rating = 14;
}

message ListGamesRequest {
  // UI language for genres ("en", "es"...). Details are downloaded in the background for it.
  string language = 1;
}
message ListGamesResponse {
  repeated Game games = 1;
  // How many games already have details (and so genres and year) in that language.
  int32 details_cached = 2;
}

message GetGameRequest {
  string id = 1;
}
message GetGameResponse {
  Game game = 1;
}

message CreateGameRequest {
  reserved 2;
  reserved "steam_app_id";

  string title = 1;
  string notes = 3;
  // Optional copies to add right away.
  repeated CopyDetails copies = 4;
  string cover_url = 5;
  map<string, string> links = 6;
}
message CreateGameResponse {
  Game game = 1;
}

message UpdateGameRequest {
  reserved 3;
  reserved "steam_app_id";

  string id = 1;
  string title = 2;
  string notes = 4;
  string cover_url = 5;
  // The game's links, replacing the current ones (an empty map unlinks every store).
  map<string, string> links = 6;
  // Like every field here, these replace the current values: send them back unchanged to keep them.
  PlayStatus play_status = 7;
  int32 rating = 8;
}
message UpdateGameResponse {
  Game game = 1;
}

message DeleteGameRequest {
  string id = 1;
}
message DeleteGameResponse {}

// MergeGamesRequest moves every copy of source_ids into target_id and deletes the sources.
// Use it when the same game was imported under different titles.
message MergeGamesRequest {
  string target_id = 1;
  repeated string source_ids = 2;
}
message MergeGamesResponse {
  Game game = 1;
}

message AddCopyRequest {
  string game_id = 1;
  CopyDetails details = 2;
}
message AddCopyResponse {
  Game game = 1;
}

message UpdateCopyRequest {
  string game_id = 1;
  string copy_id = 2;
  CopyDetails details = 3;
}
message UpdateCopyResponse {
  Game game = 1;
}

message DeleteCopyRequest {
  string game_id = 1;
  string copy_id = 2;
}
message DeleteCopyResponse {
  Game game = 1;
}

// MoveCopyRequest moves a copy to another game, or to a new game when target_game_id is empty.
message MoveCopyRequest {
  string game_id = 1;
  string copy_id = 2;
  string target_game_id = 3;
  // Title of the new game to create when target_game_id is empty.
  string new_game_title = 4;
}
message MoveCopyResponse {
  // The game the copy came from; absent if it was deleted because it had no copies left.
  Game source_game = 1;
  Game target_game = 2;
}

message MarkRedeemedKeysRequest {}
message MarkRedeemedKeysResponse {
  // Number of revealed keys marked as redeemed because the game is already in the library.
  int32 updated = 1;
}

message ListLinkStoresRequest {}

// LinkStore is a store games can be linked to.
message LinkStore {
  // Link key the store's ids are saved under in Game.links ("steam").
  string key = 1;
  string name = 2;
  // Address of a game's page in the store, with "{id}" where the link goes; empty when the
  // store has no page addressed by that id.
  string page_url = 3;
  // A provider can search the store's catalog (SearchLinks).
  bool searchable = 4;
}

message ListLinkStoresResponse {
  repeated LinkStore stores = 1;
}

message SearchLinksRequest {
  // LinkStore.key of the store to search.
  string store = 1;
  string query = 2;
}

// LinkMatch is a game found in a store's catalog.
message LinkMatch {
  // The game's id in the store: the value of its link.
  string id = 1;
  string name = 2;
  string image_url = 3;
}

message SearchLinksResponse {
  repeated LinkMatch matches = 1;
}

// NewPhoto is an uploaded photo to attach to a copy.
message NewPhoto {
  // The id POST /media/photos answered.
  string id = 1;
  string caption = 2;
  // The takenAt POST /media/photos answered, if any.
  google.protobuf.Timestamp taken_at = 3;
}

message AddCopyPhotosRequest {
  string game_id = 1;
  string copy_id = 2;
  repeated NewPhoto photos = 3;
}
message AddCopyPhotosResponse {
  Game game = 1;
}

message UpdateCopyPhotoRequest {
  string game_id = 1;
  string copy_id = 2;
  string photo_id = 3;
  string caption = 4;
}
message UpdateCopyPhotoResponse {
  Game game = 1;
}

message RemoveCopyPhotoRequest {
  string game_id = 1;
  string copy_id = 2;
  string photo_id = 3;
}
message RemoveCopyPhotoResponse {
  Game game = 1;
}

// ReorderCopyPhotosRequest gives the copy's photos in their new order; it must list each once.
message ReorderCopyPhotosRequest {
  string game_id = 1;
  string copy_id = 2;
  repeated string photo_ids = 3;
}
message ReorderCopyPhotosResponse {
  Game game = 1;
}

// SetCoverPhotoRequest makes one of the copies' photos the game's cover; an empty photo_id stops
// using a photo as the cover.
message SetCoverPhotoRequest {
  string game_id = 1;
  string photo_id = 2;
}
message SetCoverPhotoResponse {
  Game game = 1;
}

// ScannedCopy is one box of a scanning session (see AddScannedCopies).
message ScannedCopy {
  // The row's id on the scanning device, echoed in its result.
  string client_id = 1;
  // The game to add the copy to; empty: a new game.
  string game_id = 2;
  // For a new game: its title and the chosen cover.
  string title = 3;
  string cover_url = 4;
  // The copy, barcode and batch defaults included.
  CopyDetails details = 5;
}
message AddScannedCopiesRequest {
  // At most 200.
  repeated ScannedCopy items = 1;
}
message ScannedCopyResult {
  string client_id = 1;
  string game_id = 2;
  string copy_id = 3;
  // Empty when saved; otherwise what happened and what to do.
  string error = 4;
}
message AddScannedCopiesResponse {
  // One per item, in the order of the request.
  repeated ScannedCopyResult results = 1;
  // Every game created or changed.
  repeated Game games = 2;
}

message ExcludeCopyRequest {
  string game_id = 1;
  string copy_id = 2;
}
message ExcludeCopyResponse {
  // Absent when the game was left without copies and deleted.
  Game game = 1;
}

// GameService manages the catalog of games and their copies.
service GameService {
  rpc ListGames(ListGamesRequest) returns (ListGamesResponse);
  rpc GetGame(GetGameRequest) returns (GetGameResponse);
  rpc CreateGame(CreateGameRequest) returns (CreateGameResponse);
  rpc UpdateGame(UpdateGameRequest) returns (UpdateGameResponse);
  rpc DeleteGame(DeleteGameRequest) returns (DeleteGameResponse);
  rpc MergeGames(MergeGamesRequest) returns (MergeGamesResponse);
  rpc AddCopy(AddCopyRequest) returns (AddCopyResponse);
  rpc UpdateCopy(UpdateCopyRequest) returns (UpdateCopyResponse);
  rpc DeleteCopy(DeleteCopyRequest) returns (DeleteCopyResponse);
  // Removes a copy a source imported and keeps the source from importing it again. A copy added
  // by hand is refused (delete it instead).
  rpc ExcludeCopy(ExcludeCopyRequest) returns (ExcludeCopyResponse);
  rpc MoveCopy(MoveCopyRequest) returns (MoveCopyResponse);
  // Saves the boxes of a scanning session in one transaction: copies of the same new game (by
  // title) become one game; a copy that cannot be saved fails alone, with its error.
  rpc AddScannedCopies(AddScannedCopiesRequest) returns (AddScannedCopiesResponse);
  // Key sources (Humble Bundle, Fanatical…) cannot tell whether a revealed key was redeemed. If
  // the game is already in the library of the key's platform it almost certainly was: mark those
  // keys as redeemed.
  rpc MarkRedeemedKeys(MarkRedeemedKeysRequest) returns (MarkRedeemedKeysResponse);
  // Lists the stores games can be linked to, searchable or not.
  rpc ListLinkStores(ListLinkStoresRequest) returns (ListLinkStoresResponse);
  // Searches a store's catalog by title, to link a game (e.g. a physical one) to it and get its
  // cover and details.
  rpc SearchLinks(SearchLinksRequest) returns (SearchLinksResponse);
  // Attaches uploaded photos to a copy (at most 50 per copy; a photo already on it is skipped).
  rpc AddCopyPhotos(AddCopyPhotosRequest) returns (AddCopyPhotosResponse);
  rpc UpdateCopyPhoto(UpdateCopyPhotoRequest) returns (UpdateCopyPhotoResponse);
  rpc RemoveCopyPhoto(RemoveCopyPhotoRequest) returns (RemoveCopyPhotoResponse);
  rpc ReorderCopyPhotos(ReorderCopyPhotosRequest) returns (ReorderCopyPhotosResponse);
  rpc SetCoverPhoto(SetCoverPhotoRequest) returns (SetCoverPhotoResponse);
}
