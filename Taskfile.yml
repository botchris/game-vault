# Game Vault tasks (https://taskfile.dev). Run `task` to list them.
#
# Everything that compiles, tests or generates code runs inside the toolchain container
# (build/toolchain.Dockerfile): the host only needs Docker and Task. The server binary is
# cross-compiled for the host and runs there, because Game Vault's local access and Tailscale
# identity checks rely on requests arriving from 127.0.0.1, which a container cannot provide.

version: '3'

vars:
  # The version comes from the SemVer git tag (see `task release`): "0.2.0" on a tagged commit,
  # "0.2.0-3-gabc1234" after it, "-dirty" with uncommitted changes, a commit hash before the first
  # release.
  VERSION:
    sh: (git describe --tags --match 'v[0-9]*' --dirty --always 2>/dev/null || echo dev) | sed 's/^v//'
  # The commit the binaries and the image are built from.
  REVISION:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  # Docker Hub repository the image is published to (override with `task docker:publish IMAGE=…`).
  IMAGE: botchrishub/game-vault
  # The toolchain image is tagged with a hash of its Dockerfile: editing it builds a new image.
  TOOLCHAIN_HASH:
    sh: (sha256sum build/toolchain.Dockerfile 2>/dev/null || shasum -a 256 build/toolchain.Dockerfile) | cut -c1-12
  TOOLCHAIN: gamevault-toolchain:{{.TOOLCHAIN_HASH}}
  # Caches live in named volumes, so repeated builds are fast and the host stays clean.
  # web/node_modules is a volume too: npm installs Linux binaries that must not mix with the host.
  DOCKER_RUN: >-
    docker run --rm --init
    -v "{{.ROOT_DIR}}:/src" -w /src
    -v gamevault-gomod:/go/pkg/mod
    -v gamevault-gobuild:/root/.cache/go-build
    -v gamevault-npm:/root/.npm
    -v gamevault-golangci:/root/.cache/golangci-lint
    -v gamevault-node-modules:/src/web/node_modules
  IN_TOOLCHAIN: '{{.DOCKER_RUN}} {{.TOOLCHAIN}}'

tasks:
  default:
    desc: List the tasks
    silent: true
    cmds:
      - task --list

  toolchain:
    desc: Build the toolchain image (once, and whenever build/toolchain.Dockerfile changes)
    status:
      - docker image inspect {{.TOOLCHAIN}} >/dev/null 2>&1
    cmds:
      - docker build -t {{.TOOLCHAIN}} -f build/toolchain.Dockerfile build

  deps:web:
    desc: Install the web dependencies in the container (only when package-lock.json changed)
    deps: [toolchain]
    cmds:
      - >-
        {{.IN_TOOLCHAIN}} sh -c 'cd web &&
        hash=$(sha256sum package-lock.json | cut -c1-64) &&
        if [ "$(cat node_modules/.lock-hash 2>/dev/null)" != "$hash" ]; then
        npm ci --no-audit && echo "$hash" > node_modules/.lock-hash; fi'

  generate:
    desc: Regenerate Go and TypeScript code from proto/ (after editing the API)
    deps: [deps:web]
    cmds:
      - '{{.IN_TOOLCHAIN}} sh -c "buf lint && buf generate"'

  build:
    desc: Build the web UI and the server binary for this machine
    cmds:
      - task: build:web
      - task: build:server

  build:web:
    desc: Build the web UI into web/dist (type check included)
    deps: [deps:web]
    cmds:
      - '{{.IN_TOOLCHAIN}} sh -c "cd web && npm run build"'

  build:server:
    desc: Build the server binary into bin/ for this machine ({{OS}}/{{ARCH}})
    deps: [toolchain]
    cmds:
      - >-
        {{.DOCKER_RUN}} -e GOOS={{OS}} -e GOARCH={{ARCH}} {{.TOOLCHAIN}}
        go build -trimpath -ldflags "-X main.version={{.VERSION}}" -o bin/gamevault ./cmd/gamevault

  build:release:
    desc: Build server binaries for every supported platform into bin/release/
    deps: [toolchain]
    vars:
      # The Docker tasks pass only the Linux targets they package.
      TARGETS: '{{.TARGETS | default "linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64"}}'
    cmds:
      - for: { var: TARGETS, split: ' ' }
        cmd: >-
          {{.DOCKER_RUN}} -e GOOS={{index (splitList "/" .ITEM) 0}} -e GOARCH={{index (splitList "/" .ITEM) 1}} {{.TOOLCHAIN}}
          go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}"
          -o bin/release/gamevault-{{index (splitList "/" .ITEM) 0}}-{{index (splitList "/" .ITEM) 1}}{{if eq (index (splitList "/" .ITEM) 0) "windows"}}.exe{{end}}
          ./cmd/gamevault

  docker:build:
    desc: Build the Docker image for this machine as {{.IMAGE}}:dev, to try it before publishing
    cmds:
      - task: build:web
      - task: build:release
        vars: { TARGETS: 'linux/{{ARCH}}' }
      - >-
        docker buildx build --platform linux/{{ARCH}} -f build/Dockerfile
        --build-arg VERSION=dev --build-arg REVISION={{.REVISION}}
        -t {{.IMAGE}}:dev --load .

  release:
    desc: 'Tag a release: task release -- X.Y.Z (from a clean main, after lint and tests)'
    cmds:
      - build/release.sh check {{.CLI_ARGS}}
      - task: lint
      - task: test
      - build/release.sh tag {{.CLI_ARGS}}

  docker:publish:
    desc: Push the image of the release on this commit to Docker Hub, for linux/amd64 and linux/arm64 (run `docker login` first)
    preconditions:
      - sh: git describe --tags --exact-match --match 'v[0-9]*' >/dev/null 2>&1
        msg: 'This commit has no version tag: release it first with `task release -- X.Y.Z`.'
      - sh: test -z "$(git status --porcelain)"
        msg: There are uncommitted changes; the image must match the tagged commit exactly.
    vars:
      TAGS:
        sh: build/release.sh docker-tags {{.IMAGE}} 2>/dev/null || true
    prompt: 'Publish Game Vault {{.VERSION}} to Docker Hub as: {{.TAGS}}?'
    cmds:
      - task: build:web
      - task: build:release
        vars: { TARGETS: 'linux/amd64 linux/arm64' }
      - task: docker:builder
      - >-
        docker buildx build --builder gamevault --platform linux/amd64,linux/arm64 -f build/Dockerfile
        --build-arg VERSION={{.VERSION}} --build-arg REVISION={{.REVISION}}
        {{.TAGS}} --push .

  docker:builder:
    internal: true
    desc: Create the buildx builder that can push images for several platforms at once
    status:
      - docker buildx inspect gamevault >/dev/null 2>&1
    cmds:
      - docker buildx create --name gamevault --driver docker-container >/dev/null

  test:
    desc: Go vet + tests, TypeScript type check and the translation check
    deps: [deps:web]
    cmds:
      - '{{.IN_TOOLCHAIN}} sh -c "go vet ./... && go test ./... && cd web && npm run typecheck && node --test --test-timeout=10000 tests/*.test.mjs ../extension/tests/*.test.mjs && for f in ../extension/*.js; do [ -e \$f ] || continue; node --check \$f || exit 1; done && node ../.claude/scripts/check-i18n.mjs"'

  go:
    desc: 'Run one go command in the toolchain, e.g. task go -- test ./internal/adapters/outbound/sqlite/ -run TestDocuments -v'
    deps: [toolchain]
    cmds:
      - '{{.IN_TOOLCHAIN}} go {{.CLI_ARGS}}'

  fmt:
    desc: Format the Go code
    deps: [toolchain]
    cmds:
      - '{{.IN_TOOLCHAIN}} gofmt -w internal cmd'

  lint:
    desc: Lint the Go code (golangci-lint, formatting included, and the doc-comment layout) and the protobuf definitions
    deps: [toolchain]
    cmds:
      # tools/docspacing and tools/fieldlines check house rules no linter has: blank lines around
      # member doc comments, a doc comment on every interface method, and one struct field per line.
      - '{{.IN_TOOLCHAIN}} sh -c "golangci-lint run ./... && go run ./tools/docspacing internal cmd tools && go run ./tools/fieldlines ./... && buf lint"'

  lint:fix:
    desc: Apply the safe automatic lint fixes (one field per line, blank lines, comment periods, spelling, formatting)
    deps: [toolchain]
    cmds:
      # Only linters whose fixes cannot change behavior: staticcheck's would, for example, type
      # constants in a mixed const block and break the build.
      # fieldlines first: it breaks struct fields onto their own lines, which the others then tidy.
      # It exits non-zero when it applied fixes, so its status is ignored; task lint reports what is left.
      - '{{.IN_TOOLCHAIN}} sh -c "go run ./tools/fieldlines -fix ./... > /dev/null || true"'
      - '{{.IN_TOOLCHAIN}} golangci-lint run --fix --enable-only wsl_v5,godot,misspell ./...'
      - '{{.IN_TOOLCHAIN}} go run ./tools/docspacing -fix internal cmd tools'
      - '{{.IN_TOOLCHAIN}} golangci-lint fmt ./...'

  extension:pack:
    desc: Zip the browser extension (extension/) for the Chrome Web Store / Firefox Add-ons into dist/
    deps: [toolchain]
    cmds:
      - '{{.IN_TOOLCHAIN}} sh -c "mkdir -p dist && v=\$(node -p require\(process.argv[1]\).version \$PWD/extension/manifest.json) && go run ./tools/zipdir extension dist/game-vault-connector-\$v.zip tests package.json && echo dist/game-vault-connector-\$v.zip"'

  i18n:
    desc: Check that every UI language has the same translation keys as English
    deps: [toolchain]
    cmds:
      - '{{.IN_TOOLCHAIN}} node .claude/scripts/check-i18n.mjs'

  run:
    desc: Build everything and run the server on http://127.0.0.1:8080 (on the host)
    cmds:
      - task: build
      - ./bin/gamevault

  dev:web:
    desc: Rebuild the web UI into web/dist on every change (in the container); the server from `task run` serves it, reload the page to see changes
    deps: [deps:web]
    cmds:
      - '{{.DOCKER_RUN}} -it {{.TOOLCHAIN}} sh -c "cd web && npx vite build --watch"'
    interactive: true

  shell:
    desc: Open a shell in the toolchain container (repository at /src)
    deps: [toolchain]
    cmds:
      - '{{.DOCKER_RUN}} -it {{.TOOLCHAIN}} bash'
    interactive: true

  test-server:
    desc: 'Throwaway server on http://127.0.0.1:8093 with a copy of config/ (CLI_ARGS: --full copies images too)'
    cmds:
      - task: build
      - .claude/scripts/test-server.sh {{.CLI_ARGS}}

  test-server:stop:
    desc: Stop the test server
    cmds:
      - .claude/scripts/test-server.sh --stop

  clean:
    desc: Remove build output (never touches config/)
    cmds:
      - rm -rf bin web/dist

  clean:caches:
    desc: Remove the toolchain caches (Go modules, build cache, npm, web/node_modules volumes)
    cmds:
      - docker volume rm -f gamevault-gomod gamevault-gobuild gamevault-npm gamevault-node-modules
