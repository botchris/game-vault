# Go lint configuration (golangci-lint v2, pinned in build/toolchain.Dockerfile). Run it with
# `task lint`. The house rules behind it are in .claude/skills/write-go/SKILL.md.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - godot
    - misspell
    - nakedret
    - prealloc
    - revive
    - wsl_v5
  settings:
    errcheck:
      # Closing what was only read, and writing a response the client may have abandoned, have no
      # useful error to act on. Closing a file that was written is still checked.
      exclude-functions:
        - (io.ReadCloser).Close
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - (net/http.ResponseWriter).Write
    godot:
      # Only doc comments on top-level declarations; inline notes may stay unpunctuated.
      scope: declarations
    misspell:
      locale: US
    revive:
      rules:
        - name: comment-spacings
        - name: early-return
        - name: empty-lines
        - name: error-naming
        - name: error-strings
        - name: exported
        - name: if-return
        - name: superfluous-else
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
  exclusions:
    # Code generated by buf (internal/gen) follows its generators' style, not ours.
    generated: lax
    rules:
      # Fake servers in tests write canned answers; a failed write fails the test anyway.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
